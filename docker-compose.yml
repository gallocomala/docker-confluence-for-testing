services:
  confluence:
    container_name: confluence_${PACKAGE_NAME}
    hostname: confluence
    image: confluence-4-testing:${CONFLUENCE_VERSION}
    build:
      context: .
      args:
        CONFLUENCE_VERSION: ${CONFLUENCE_VERSION}
        JAVA_VERSION: ${JAVA_VERSION}
    environment:
      - TZ
      - LC_ALL
      - LANG
      - LANGUAGE
      # OpenSearch integration
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_HTTP_URL=http://opensearch-node:9200
    ports:
      - "${CONFLUENCE_PORT}:8090"
      - "${CONFLUENCE_SYNCHRONY_PORT}:8091"
      - "${DEBUG_PORT}:5005"
    depends_on:
      - ldap
      - opensearch-node
    networks:
      - confluence-net
    volumes:
      - ${VOLUME_PATH}${PACKAGE_NAME}:/var/atlassian/application-data/confluence


  postgres:
    image: postgres:${POSTGRESQL_VERSION}
    container_name: postgres_${PACKAGE_NAME}
    hostname: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=confluence
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - confluence-net

  oracle:
    image: oskarflores/confluence-database:oracle-${ORACLE_VERSION}
    container_name: oracle
    hostname: oracle
    ports:
      - "${ORACLE_LISTENER_PORT}:1521"
      - "${ORACLE_PORT}:8080"
    networks:
      - confluence-net

  mysql:
    image: oskarflores/confluence-database:mysql-${MYSQL_VERSION}
    container_name: mysql
    hostname: mysql
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - confluence-net

  sqlserver:
    image: oskarflores/confluence-database:sqlserver-${SQLSERVER_VERSION}
    container_name: sqlserver
    hostname: sqlserver
    ports:
      - "${SQLSERVER_PORT}:1433"
    networks:
      - confluence-net


  ldap:
    image: aruizca/confluence-test-ldap
    container_name: ldap_${PACKAGE_NAME}
    hostname: ldap
    privileged: true
    ports:
      - "${LDAP_PORT}:389"
    networks:
      - confluence-net

  puppeteer-confluence-setup:
    image: aruizca/puppeteer-confluence-setup
    container_name: puppeteer-confluence-setup_${PACKAGE_NAME}
    hostname: puppeteer
    environment:
      - PPTR_HEADLESS=true
      - PPTR_CONFLUENCE_BASE_URL=http://confluence:8090/confluence
      - PPTR_JDBC_URL=jdbc:postgresql://postgres:5432/confluence
      - PPTR_LDAP_PORT=389
      - PPTR_LDAP_CONFIG=true
      - PPTR_CONFLUENCE_LICENSE=${PPTR_CONFLUENCE_LICENSE}
    volumes:
      - "./screenshots:/app/screenshots"
    depends_on:
      - confluence
    networks:
      - confluence-net

  opensearch-node:
    build:
      context: ./opensearch
    image: opensearch-no-security
    container_name: opensearch-node
    hostname: opensearch-node
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "${OPENSEARCH_PORT}:9200"
      - "${OPENSEARCH_PERF_PORT}:9600"
    networks:
      - confluence-net

  opensearch-dashboards:
    build:
      context: ./opensearch-dashboards
    image: opensearch-dashboards-no-security
    container_name: osd
    hostname: opensearch-dashboards
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT}:5601"
    depends_on:
      - opensearch-node
    networks:
      - confluence-net

networks:
  confluence-net:
    driver: bridge
